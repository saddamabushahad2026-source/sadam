        // توليد 500 بطاقة مسابقة عشوائية
        function generateContestBatch() {
            let s = Number(SEED_CODE) % 2147483647;
            const rand = () => {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            };
            const usedNumbers = new Set();
            const pool = [];

            for (let i = 0; i < 50; i++) pool.push({ type: 1, label: 'ميني كيك مجاني' });
            for (let i = 0; i < 400; i++) pool.push({ type: 2, label: 'السحب الشهري 250,000 دينار' });
            for (let i = 0; i < 50; i++) pool.push({ type: 3, label: 'جوائز فورية أخرى' });

            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            const cardsObj = {};
            pool.forEach((item, index) => {
                let num;
                do {
                    num = Math.floor(1000 + rand() * 9000);
                } while (usedNumbers.has(num));
                usedNumbers.add(num);
                const code = `MUH-${num}`;
                cardsObj[code] = {
                    seq: index + 1,
                    code,
                    type: item.type,
                    label: item.label
                };
            });
            return cardsObj;
        }

        // شاشة الزبون عند مسح الباركود
        function CustomerScanView({ codeParam }) {
            const [status, setStatus] = useState('loading');
            const [cardData, setCardData] = useState(null);
            const [redeemRecord, setRedeemRecord] = useState(null);
            const [imgAttempt, setImgAttempt] = useState(0);

            const extensions = ['jpeg', 'jpg', 'png', 'webp'];

            useEffect(() => {
                const verifyAndClaim = async () => {
                    if (!window.firebaseDB) {
                        setTimeout(verifyAndClaim, 200);
                        return;
                    }
                    const { db, ref, get, set } = window.firebaseDB;
                    try {
                        const cardSnap = await get(ref(db, `contest_cards/${codeParam}`));
                        if (!cardSnap.exists()) {
                            setStatus('invalid');
                            return;
                        }
                        const card = cardSnap.val();
                        setCardData(card);
                        setImgAttempt(0);

                        const redeemedSnap = await get(ref(db, `contest_redeemed/${codeParam}`));
                        if (redeemedSnap.exists()) {
                            setRedeemRecord(redeemedSnap.val());
                            setStatus('used');
                            return;
                        }

                        const nowStr = new Date().toLocaleString('ar-IQ');
                        const newRecord = {
                            code: codeParam,
                            prize: card.label,
                            claimedAt: nowStr
                        };
                        await set(ref(db, `contest_redeemed/${codeParam}`), newRecord);
                        setRedeemRecord(newRecord);
                        setStatus('valid');
                    } catch (err) {
                        setStatus('invalid');
                    }
                };
                verifyAndClaim();
            }, [codeParam]);

            const currentExt = extensions[imgAttempt];

            return (
                <div className="min-h-screen bg-[#1a0508] flex flex-col items-center justify-center p-4 text-center">
                    {status === 'loading' && (
                        <div className="text-amber-400 font-black text-lg animate-pulse">
                            <i className="fa-solid fa-spinner fa-spin ml-2"></i> جاري التحقق من بطاقة الجائزة...
                        </div>
                    )}

                    {status === 'invalid' && (
                        <div className="max-w-md w-full bg-[#33070d] border-2 border-amber-500 rounded-3xl p-8 shadow-2xl space-y-3">
                            <div className="text-amber-400 text-4xl"><i className="fa-solid fa-circle-exclamation"></i></div>
                            <h2 className="text-xl font-black text-white">رمز البطاقة غير صالح أو تم حذفه</h2>
                            <p className="text-sm text-gray-300">يرجى التأكد من مسح الباركود المطبوع على علب حلويات الشهد خاتون.</p>
                        </div>
                    )}

                    {status === 'used' && cardData && (
                        <div className="max-w-md w-full bg-[#33070d] border-2 border-[#d4af37] rounded-3xl p-8 shadow-2xl space-y-3">
                            <span className="inline-block bg-amber-500/20 text-amber-300 border border-amber-400 px-4 py-1 rounded-full text-xs font-extrabold">
                                حلويات الشهد خاتون
                            </span>
                            <h2 className="text-2xl font-black text-white">تم التسجيل في القرعة سابقاً</h2>
                            <div className="inline-block bg-[#fdf6e7] text-[#5c1119] font-black text-lg px-5 py-1.5 rounded-xl tracking-wider" dir="ltr">
                                {cardData.code}
                            </div>
                            <p className="text-xs text-amber-100/80">تم استخدام هذا الرمز مسبقاً بتاريخ: {redeemRecord?.claimedAt}</p>
                        </div>
                    )}

                    {status === 'valid' && cardData && (
                        <div className="relative w-full max-w-[420px] rounded-2xl overflow-hidden shadow-2xl border-2 border-[#d4af37] bg-[#2b070c]">
                            {currentExt ? (
                                <>
                                    <img
                                        key={`${cardData.type}-${currentExt}`}
                                        src={`./${cardData.type}.${currentExt}`}
                                        alt="حلويات الشهد خاتون"
                                        className="w-full h-auto block"

                                    </div>
                                    <p className="text-xs text-amber-200/80">

            const [editingCategory, setEditingCategory] = useState(null);
            const [barcodeModalProduct, setBarcodeModalProduct] = useState(null);

            useEffect(() => {
                const initListeners = () => {
                    if (!window.firebaseDB) return;
                    const { db, ref, onValue, set } = window.firebaseDB;

                    onValue(ref(db, 'products'), (snapshot) => {
                        const data = snapshot.val();
                        setProducts(data ? Object.values(data).filter(p => p && p.id && p.name) : []);
                    });

                    onValue(ref(db, 'categories'), (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            setCategories(Object.values(data).filter(c => c && c.id && c.name));
                        } else {
                            set(ref(db, 'categories'), INITIAL_CATEGORIES_OBJ);
                        }
                    });

                    onValue(ref(db, 'orders'), (snapshot) => {
                        const data = snapshot.val();
                        setOrders(data ? Object.values(data).filter(Boolean).reverse() : []);
                    });

                    onValue(ref(db, 'factorySales'), (snapshot) => {
                        const data = snapshot.val();
                        setFactorySales(data ? Object.values(data).filter(Boolean).reverse() : []);
                    });

                    onValue(ref(db, 'expenses'), (snapshot) => {
                        const data = snapshot.val();
                        setExpenses(data ? Object.values(data).filter(Boolean).reverse() : []);
                    });

                    onValue(ref(db, 'contest_cards'), (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const sorted = Object.values(data).filter(Boolean).sort((a, b) => a.seq - b.seq);
                            setContestCards(sorted);
                        } else {
                            setContestCards([]);
                        }
                    });

                    onValue(ref(db, 'contest_redeemed'), (snapshot) => {
                        setContestRedeemed(snapshot.val() || {});
                    });
                };

                if (window.firebaseDB) {
                    initListeners();
                } else {
                    window.addEventListener('firebase-ready', initListeners);
                    return () => window.removeEventListener('firebase-ready', initListeners);
                }
            }, []);

            // تنظيف قائمة طباعة الكارتات بعد انتهاء الطباعة
            useEffect(() => {
                const onAfterPrint = () => {
                    setPrintCardsQueue([]);
                };
                window.addEventListener('afterprint', onAfterPrint);
                return () => window.removeEventListener('afterprint', onAfterPrint);
            }, []);

            // طباعة الوصولات أو باركود المخزون بحجم A4
            const triggerA4Print = () => {
                setPrintCardsQueue([]);
                setTimeout(() => {
                    window.print();
                }, 250);
            };

            // طباعة كارتات المسابقة بحجم A4 كامل لكل كارت
            const triggerContestA4Print = (cardsList) => {
                if (!cardsList || cardsList.length === 0) return;
                setPrintCardsQueue(cardsList);
                setTimeout(() => {
                    window.print();
                }, 400);
            };

            const handleTabChangeRequest = (tabName) => {
                if (tabName === 'pos' || tabName === 'factory' || tabName === 'expenses') {
                    setActiveTab(tabName);
                } else {
                    setPendingTab(tabName);
                    setEnteredPin('');
                    setPinError(false);
                    setIsPinModalOpen(true);
                }
            };

            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (enteredPin === SECURITY_PIN) {
                    setActiveTab(pendingTab);
                    setIsPinModalOpen(false);
                    setPendingTab(null);
                    setEnteredPin('');
                    setPinError(false);
                } else {
                    setPinError(true);
                }
            };

            // ================= دوال المسابقة والستيكرات =================
            const handleGenerate500Cards = () => {
                if (contestCards.length > 0) {
                    if (!confirm('يوجد بطاقات مولدة حالياً. هل تريد استبدالها وتوليد 500 بطاقة جديدة؟')) return;
                }
                const newBatch = generateContestBatch();
                if (window.firebaseDB) {
                    const { db, ref, set } = window.firebaseDB;
                    set(ref(db, 'contest_cards'), newBatch);
                    setContestPage(1);
                }
            };

            const handleDeleteAllContestBarcodes = () => {
                if (!confirm('تحذير: هل أنت متأكد من حذف كل الباركود (الـ 500 بطاقة وسجل القرعة) نهائياً من قاعدة البيانات؟')) return;
                if (window.firebaseDB) {
                    const { db, ref, remove } = window.firebaseDB;
                    Promise.all([
                        remove(ref(db, 'contest_cards')),
                        remove(ref(db, 'contest_redeemed'))
                    ]).then(() => {
                        setContestCards([]);
                        setContestRedeemed({});
                        setContestPage(1);
                        alert('تم حذف كل الباركود وسجل القرعة بنجاح.');
                    });
                }
            };

            const handleUnlockContestCode = (code) => {
                if (window.firebaseDB) {
                    const { db, ref, remove } = window.firebaseDB;
                    remove(ref(db, `contest_redeemed/${code}`));
                }
            };

            const handleExportContestExcel = () => {
                if (contestCards.length === 0) {
                    alert('لا توجد بطاقات لتصديرها!');
                    return;
                }
                const cleanUrl = contestBaseUrl.trim();
                const rows = contestCards.map(c => {
                    const rec = contestRedeemed[c.code];
                    return {
                        'التسلسل': c.seq,
                        'رمز البطاقة': c.code,
                        'رمز التوليد': SEED_CODE,
                        'نوع الجائزة': c.label,
                        'حالة البطاقة': rec ? 'تم التسجيل في القرعة سابقاً' : 'متاحة',
                        'تاريخ التسجيل': rec ? rec.claimedAt : '',
                        'رابط الباركود المباشر': `${cleanUrl}?c=${c.code}`
                    };
                });
                const worksheet = XLSX.utils.json_to_sheet(rows);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, `سجل_${SEED_CODE}`);
                XLSX.writeFile(workbook, `سجل_مسابقة_الشهد_خاتون_${SEED_CODE}.xlsx`);
            };

            const filteredContestCards = useMemo(() => {
                return contestCards.filter(c => {
                    if (contestTypeFilter !== 'all' && String(c.type) !== contestTypeFilter) return false;
                    return true;
                });
            }, [contestCards, contestTypeFilter]);

            const totalContestPages = Math.max(1, Math.ceil(filteredContestCards.length / ITEMS_PER_PAGE));

            const visibleContestCards = useMemo(() => {
                const start = (contestPage - 1) * ITEMS_PER_PAGE;
                return filteredContestCards.slice(start, start + ITEMS_PER_PAGE);
            }, [filteredContestCards, contestPage]);

            const filteredContestLogs = useMemo(() => {
                return contestCards.filter(c => {
                    const isUsed = Boolean(contestRedeemed[c.code]);
                    if (contestStatusFilter === 'used' && !isUsed) return false;
                    if (contestStatusFilter === 'available' && isUsed) return false;
                    if (contestSearchCode && !c.code.includes(contestSearchCode.toUpperCase()) && !c.label.includes(contestSearchCode)) return false;
                    return true;
                });
            }, [contestCards, contestRedeemed, contestStatusFilter, contestSearchCode]);

            // ================= دوال نقطة البيع والمخزون =================
            const filteredProducts = useMemo(() => {
                return products.filter(product => {
                    const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
                    const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (product.barcode && product.barcode.includes(searchQuery)) ||
                        String(product.id) === searchQuery.trim();
                    return matchesCategory && matchesSearch;
                });
            }, [products, selectedCategory, searchQuery]);

            const grandTotal = useMemo(() => cart.reduce((acc, item) => acc + item.itemTotal, 0), [cart]);

            const addOrIncrementProductDirectly = (product) => {
                if (!product) return;
                if (product.stock <= 0) {
                    alert('عذراً، هذا المنتج نفد من المخزون!');
                    return;
                }
                const cat = categories.find(c => c.id === product.category);
                const type = cat ? (cat.type || 'weight') : 'weight';
                const baseCost = product.costPrice || 0;
                const detailsLabel = type === 'weight' ? 'الوزن: 1 كغم (1000 غرام)' : 'العدد: 1 قطعة';
                const cartKey = `${product.id}-${type}-1`;

                setCart(prev => {
                    const existing = prev.findIndex(item => item.cartKey === cartKey);
                    if (existing > -1) {
                        const updated = [...prev];
                        const unitPrice = updated[existing].itemTotal / updated[existing].quantity;
                        const unitCost = updated[existing].itemCostTotal / updated[existing].quantity;
                        updated[existing].quantity += 1;
                        updated[existing].itemTotal = updated[existing].quantity * unitPrice;
                        updated[existing].itemCostTotal = updated[existing].quantity * unitCost;
                        return updated;
                    }
                    return [...prev, {
                        cartKey, id: product.id, name: product.name, category: product.category,
                        basePrice: product.price, costPrice: baseCost, modalType: type,
                        weight: 1, detailsLabel, quantity: 1, itemTotal: product.price, itemCostTotal: baseCost
                    }];
                });
            };

            const handleScanSubmit = (e) => {
                e.preventDefault();
                const rawInput = scanInput.trim();
                if (!rawInput) return;
                const foundProduct = products.find(p => p.barcode === rawInput || String(p.id) === rawInput || p.name.toLowerCase().includes(rawInput.toLowerCase()));
                if (foundProduct) {
                    addOrIncrementProductDirectly(foundProduct);
                    setScanInput('');
                } else {
                    alert('لم يتم العثور على أي منتج يطابق الباركود أو الاسم المدخل!');
                    setScanInput('');
                }
            };

            const updateCartQuantity = (cartKey, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.cartKey === cartKey) {
                        const newQty = item.quantity + delta;
                        if (newQty > 0) {
                            const unitPrice = item.itemTotal / item.quantity;
                            const unitCost = item.itemCostTotal / item.quantity;
                            return { ...item, quantity: newQty, itemTotal: newQty * unitPrice, itemCostTotal: newQty * unitCost };
                        }
                        return null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const handleCheckoutOpenDrawer = () => {
                if (cart.length === 0) return;
                const totalCost = cart.reduce((acc, item) => acc + (item.itemCostTotal || 0), 0);
                const now = new Date();
                const newOrder = {
                    id: `ORD-${Date.now().toString().slice(-4)}`,
                    date: now.toLocaleString('ar-IQ'),
                    rawDate: now.toISOString().split('T')[0],
                    items: [...cart],
                    total: grandTotal,
                    totalCost,
                    profit: grandTotal - totalCost
                };

                const updatedProducts = products.map(prod => {
                    const matchedItems = cart.filter(c => c.id === prod.id);
                    if (matchedItems.length > 0) {
                        const totalDeducted = matchedItems.reduce((acc, ci) => acc + ci.quantity, 0);
                        return { ...prod, stock: Math.max(0, prod.stock - totalDeducted) };
                    }
                    return prod;
                });

                if (window.firebaseDB) {
                    const { db, ref, set } = window.firebaseDB;
                    set(ref(db, `orders/${newOrder.id}`), newOrder);
                    updatedProducts.forEach(p => set(ref(db, `products/${p.id}`), p));
                }

                setCurrentInvoice(newOrder);
                setCart([]);
            };

            const handleAddFactorySale = (e) => {
                e.preventDefault();
                if (!selectedFactoryProduct) return alert('الرجاء اختيار مادة من المخزن!');
                const prod = products.find(p => p.id === parseInt(selectedFactoryProduct));
                if (!prod) return;
                const qty = parseFloat(factoryQuantity) || 0;
                const price = factoryPriceCustom !== '' ? parseFloat(factoryPriceCustom) : (prod.factoryPrice || prod.price);
                if (qty <= 0 || price <= 0) return alert('يرجى إدخال كمية وسعر صالحين!');
                if (prod.stock < qty) return alert(`الكمية المتاحة بالمخزن فقط: ${prod.stock}`);

                const now = new Date();
                const newSale = {
                    id: `FAC-${Date.now().toString().slice(-4)}`,
                    productId: prod.id, productName: prod.name,
                    quantity: qty, price, total: qty * price,
                    date: now.toLocaleString('ar-IQ'),
                    rawDate: now.toISOString().split('T')[0]
                };

                if (window.firebaseDB) {
                    const { db, ref, set } = window.firebaseDB;
                    set(ref(db, `factorySales/${newSale.id}`), newSale);
                    set(ref(db, `products/${prod.id}`), { ...prod, stock: prod.stock - qty });
                }

                setSelectedFactoryProduct('');
                setFactoryQuantity('1');
                setFactoryPriceCustom('');
            };

            const handleAddExpense = (e) => {
                e.preventDefault();
                const amt = parseFloat(expenseAmount);
                if (!amt || amt <= 0 || !expenseDetails.trim()) return alert('يرجى إدخال المبلغ وتفاصيل الصرف!');
                const newExpense = {
                    id: `EXP-${Date.now().toString().slice(-4)}`,
                    amount: amt, details: expenseDetails.trim(),
                    date: expenseDate, rawDate: expenseDate
                };
                if (window.firebaseDB) {
                    const { db, ref, set } = window.firebaseDB;
                    set(ref(db, `expenses/${newExpense.id}`), newExpense);
                }
                setExpenseAmount('');
                setExpenseDetails('');
            };

            const handleDeleteExpense = (id) => {
                if (confirm('هل تريد حذف هذه الصرفية؟') && window.firebaseDB) {
                    window.firebaseDB.remove(window.firebaseDB.ref(window.firebaseDB.db, `expenses/${id}`));
                }
            };

            const handleSaveCategory = (catData) => {
                const catId = editingCategory ? editingCategory.id : 'cat_' + Date.now();
                if (window.firebaseDB) {
                    window.firebaseDB.set(window.firebaseDB.ref(window.firebaseDB.db, `categories/${catId}`), { ...catData, id: catId });
                }
                setIsCategoryModalOpen(false);
                setEditingCategory(null);
            };

            const handleDeleteCategory = (catId) => {
                if (products.some(p => p.category === catId)) return alert('لا يمكن حذف قسم يحتوي على منتجات.');
                if (confirm('هل أنت متأكد من الحذف؟') && window.firebaseDB) {
                    window.firebaseDB.remove(window.firebaseDB.ref(window.firebaseDB.db, `categories/${catId}`));
                }
            };

            const handleSaveProduct = (prodData) => {
                const prodId = editingProduct ? editingProduct.id : Date.now();
                if (window.firebaseDB) {
                    window.firebaseDB.set(window.firebaseDB.ref(window.firebaseDB.db, `products/${prodId}`), { ...prodData, id: prodId });
                }
                setIsProductModalOpen(false);
                setEditingProduct(null);
            };

            const handleDeleteProduct = (id) => {
                if (confirm('هل تريد حذف هذا المنتج نهائياً؟') && window.firebaseDB) {
                    window.firebaseDB.remove(window.firebaseDB.ref(window.firebaseDB.db, `products/${id}`));
                }
            };

            const filteredFactorySales = useMemo(() => {
                return factorySales.filter(sale => {
                    const matchesName = !factorySearchName.trim() || sale.productName.toLowerCase().includes(factorySearchName.toLowerCase());
                    const matchesDate = !factorySearchDate || sale.rawDate === factorySearchDate;
                    return matchesName && matchesDate;
                });
            }, [factorySales, factorySearchName, factorySearchDate]);

            const filteredOrders = useMemo(() => {
                return orders.filter(ord => {
                    const ordDate = ord.rawDate;
                    const matchesStart = !startDate || (ordDate && ordDate >= startDate);
                    const matchesEnd = !endDate || (ordDate && ordDate <= endDate);
                    const matchesCat = filterCategory === 'all' || ord.items.some(item => {
                        const prod = products.find(p => p.id === item.id);
                        return prod && prod.category === filterCategory;
                    });
                    const matchesSearch = !reportProductSearch.trim() || ord.items.some(item => item.name.toLowerCase().includes(reportProductSearch.toLowerCase()));
                    return matchesStart && matchesEnd && matchesCat && matchesSearch;
                });
            }, [orders, startDate, endDate, filterCategory, reportProductSearch, products]);

            const filteredFactoryReports = useMemo(() => {
                return factorySales.filter(sale => {
                    const matchesStart = !startDate || (sale.rawDate && sale.rawDate >= startDate);
                    const matchesEnd = !endDate || (sale.rawDate && sale.rawDate <= endDate);
                    const matchesSearch = !reportProductSearch.trim() || sale.productName.toLowerCase().includes(reportProductSearch.toLowerCase());
                    return matchesStart && matchesEnd && matchesSearch;
                });
            }, [factorySales, startDate, endDate, reportProductSearch]);

            const filteredExpensesReports = useMemo(() => {
                return expenses.filter(exp => {
                    const expDate = exp.rawDate || exp.date;
                    const matchesStart = !startDate || (expDate && expDate >= startDate);
                    const matchesEnd = !endDate || (expDate && expDate <= endDate);
                    const matchesSearch = !reportProductSearch.trim() || exp.details.toLowerCase().includes(reportProductSearch.toLowerCase());
                    return matchesStart && matchesEnd && matchesSearch;
                });
            }, [expenses, startDate, endDate, reportProductSearch]);

            const reportStats = useMemo(() => {
                let sales = 0, cost = 0, factoryTotal = 0, totalExpenses = 0;
                filteredOrders.forEach(o => { sales += o.total; cost += (o.totalCost || 0); });
                filteredFactoryReports.forEach(f => { factoryTotal += f.total; });
                filteredExpensesReports.forEach(e => { totalExpenses += e.amount; });
                return {
                    totalSales: sales, totalCost: cost, factoryTotal, totalExpenses,
                    netProfit: (sales - cost) + factoryTotal - totalExpenses
                };
            }, [filteredOrders, filteredFactoryReports, filteredExpensesReports]);

            return (
                <>
                    <div className="flex flex-col h-screen overflow-hidden bg-[#121212] text-gray-200 no-print">
                        {/* NAVBAR */}
                        <header className="bg-[#1A1A1A] text-gray-200 border-b border-[#2D2D2D] shadow-md z-20 flex-shrink-0">
                            <div className="max-w-7xl mx-auto px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
                                <div className="flex items-center space-x-2.5 space-x-reverse">
                                    <div className="w-10 h-10 rounded-full bg-pink-600 flex items-center justify-center text-white text-lg font-bold shadow">
                                        <i className="fa-solid fa-ice-cream"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-sm sm:text-base font-black text-white">حلويات ومرطبات الشهد خاتون</h1>
                                        <p className="text-[11px] text-emerald-400 font-bold">نظام الكاشير، المعمل، والمسابقات</p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 flex-wrap">
                                    <button onClick={() => alert('تم إرسال إشارة فتح درج النقود بنجاح.')} className="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-black shadow flex items-center gap-1">
                                        <i className="fa-solid fa-cash-register"></i> فتح الصندوق
                                    </button>

                                    <nav className="flex gap-1 bg-[#252525] p-1 rounded-xl border border-[#333] overflow-x-auto">
                                        <button onClick={() => handleTabChangeRequest('pos')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'pos' ? 'bg-pink-600 text-white' : 'text-gray-300 hover:bg-[#333]'}`}>
                                            <i className="fa-solid fa-cash-register ml-1"></i> نقطة البيع
                                        </button>
                                        <button onClick={() => handleTabChangeRequest('factory')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'factory' ? 'bg-pink-600 text-white' : 'text-gray-300 hover:bg-[#333]'}`}>
                                            <i className="fa-solid fa-industry ml-1"></i> المعمل
                                        </button>
                                        <button onClick={() => handleTabChangeRequest('expenses')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'expenses' ? 'bg-pink-600 text-white' : 'text-gray-300 hover:bg-[#333]'}`}>
                                            <i className="fa-solid fa-wallet ml-1"></i> الصرفيات
                                        </button>
                                        <button onClick={() => handleTabChangeRequest('categories')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'categories' ? 'bg-pink-600 text-white' : 'text-gray-300 hover:bg-[#333]'}`}>
                                            <i className="fa-solid fa-lock text-[10px] ml-1 text-pink-400"></i> الأقسام
                                        </button>
                                        <button onClick={() => handleTabChangeRequest('inventory')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'inventory' ? 'bg-pink-600 text-white' : 'text-gray-300 hover:bg-[#333]'}`}>
                                            <i className="fa-solid fa-lock text-[10px] ml-1 text-pink-400"></i> المخزون
                                        </button>
                                        <button onClick={() => handleTabChangeRequest('contest')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'contest' ? 'bg-amber-600 text-white' : 'text-amber-300 hover:bg-[#333]'}`}>
                                            <i className="fa-solid fa-lock text-[10px] ml-1"></i><i className="fa-solid fa-gift ml-1"></i> المسابقة والستيكرات
                                        </button>
                                        <button onClick={() => handleTabChangeRequest('reports')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'reports' ? 'bg-pink-600 text-white' : 'text-gray-300 hover:bg-[#333]'}`}>
                                            <i className="fa-solid fa-lock text-[10px] ml-1 text-pink-400"></i> التقارير
                                        </button>
                                    </nav>
                                </div>
                            </div>
                        </header>

                        {/* MAIN CONTENT */}
                        <div className="flex-1 flex flex-col md:flex-row overflow-hidden pb-8">

                            {/* 1. POS TAB */}
                            {activeTab === 'pos' && (
                                <div className="flex-1 flex flex-col-reverse md:flex-row overflow-hidden w-full h-full">
                                    <div className="flex-1 flex flex-col p-3 sm:p-4 overflow-hidden bg-[#121212]">
                                        <div className="space-y-3 mb-3 flex-shrink-0">
                                            <div className="relative">
                                                <input type="text" placeholder="ابحث باسم المادة أو الباركود..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full pr-10 pl-4 py-2.5 text-sm bg-[#1E1E1E] border border-[#2D2D2D] rounded-xl text-white font-bold focus:outline-none focus:ring-2 focus:ring-pink-500" />
                                                <i className="fa-solid fa-magnifying-glass absolute right-3.5 top-3 text-gray-400"></i>
                                            </div>
                                            <div className="flex space-x-2 space-x-reverse overflow-x-auto pb-1">
                                                <button onClick={() => setSelectedCategory('all')} className={`px-4 py-1.5 rounded-xl font-bold text-xs whitespace-nowrap ${selectedCategory === 'all' ? 'bg-pink-600 text-white' : 'bg-[#1E1E1E] text-gray-300 border border-[#2D2D2D]'}`}>الكل</button>
                                                {categories.map(cat => (
                                                    <button key={cat.id} onClick={() => setSelectedCategory(cat.id)} style={selectedCategory === cat.id ? { backgroundColor: cat.color || '#EC4899', color: '#fff' } : {}} className={`px-4 py-1.5 rounded-xl font-bold text-xs whitespace-nowrap ${selectedCategory === cat.id ? 'shadow' : 'bg-[#1E1E1E] text-gray-300 border border-[#2D2D2D]'}`}>
                                                        {cat.name}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex-1 overflow-y-auto pr-1">
                                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                                                {filteredProducts.map(prod => {
                                                    const isPiece = categories.find(c => c.id === prod.category)?.type === 'piece';
                                                    return (
                                                        <div key={prod.id} onClick={() => addOrIncrementProductDirectly(prod)} className="group bg-[#1E1E1E] rounded-2xl p-3 border border-[#2D2D2D] hover:border-pink-500/60 cursor-pointer flex flex-col justify-between relative transition-all active:scale-95">
                                                            <div className="absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-extrabold z-10 bg-emerald-950/90 text-emerald-300 border border-emerald-800">
                                                                {prod.stock > 0 ? `متبقي: ${prod.stock}` : 'نفد'}

                            <option value="piece">نظام القطع</option>
                        </select>
                        <input type="color" value={color} onChange={e => setColor(e.target.value)} className="w-14 h-9 bg-[#252525] rounded-lg" />
                        <div className="flex gap-2">
                            <button onClick={() => { if(name.trim()) onSave({ name, type, color, icon: 'fa-tag' }); }} className="flex-1 bg-pink-600 text-white font-black py-2.5 rounded-xl text-xs">حفظ</button>
                            <button onClick={onClose} className="px-4 bg-[#2A2A2A] text-gray-300 font-bold py-2.5 rounded-xl text-xs">إلغاء</button>
                        </div>
                    </div>
                </div>
            );
        }

        function ProductFormModal({ product, categories, onClose, onSave }) {
            const [name, setName] = useState(product ? product.name : '');
            const [barcode, setBarcode] = useState(product ? product.barcode : generateBarcodeNumber());
            const [price, setPrice] = useState(product ? product.price : '');
            const [factoryPrice, setFactoryPrice] = useState(product ? product.factoryPrice : '');
            const [costPrice, setCostPrice] = useState(product ? product.costPrice : '');
            const [category, setCategory] = useState(product ? product.category : (categories[0]?.id || ''));
            const [stock, setStock] = useState(product ? product.stock : 50);
            const [image, setImage] = useState(product ? product.image : 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=300&auto=format&fit=crop&q=80');

            return (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-3">
                    <div className="bg-[#1E1E1E] rounded-3xl max-w-md w-full p-6 space-y-3 border border-[#2D2D2D]">
                        <h3 className="font-black text-base text-white">{product ? 'تعديل المنتج' : 'إضافة منتج جديد'}</h3>
                        <input type="text" placeholder="اسم المنتج" value={name} onChange={e => setName(e.target.value)} className="w-full px-3 py-2 bg-[#252525] border border-[#333] rounded-xl text-white text-xs font-bold" />
                        <div className="flex gap-2">
                            <input type="text" value={barcode} onChange={e => setBarcode(e.target.value)} className="flex-1 px-3 py-2 bg-[#252525] border border-[#333] rounded-xl font-mono text-white text-xs" />
                            <button type="button" onClick={() => setBarcode(generateBarcodeNumber())} className="px-3 bg-[#2A2A2A] text-pink-400 rounded-xl text-xs font-bold">توليد</button>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            <input type="number" placeholder="التكلفة" value={costPrice} onChange={e => setCostPrice(e.target.value)} className="px-3 py-2 bg-[#252525] border border-[#333] rounded-xl text-amber-300 text-xs font-bold" />
                            <input type="number" placeholder="سعر المعمل" value={factoryPrice} onChange={e => setFactoryPrice(e.target.value)} className="px-3 py-2 bg-[#252525] border border-[#333] rounded-xl text-cyan-300 text-xs font-bold" />
                            <input type="number" placeholder="سعر المفرد" value={price} onChange={e => setPrice(e.target.value)} className="px-3 py-2 bg-[#252525] border border-[#333] rounded-xl text-pink-300 text-xs font-black" />
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                            <select value={category} onChange={e => setCategory(e.target.value)} className="px-3 py-2 bg-[#252525] border border-[#333] rounded-xl text-white text-xs font-bold">
                                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                            <input type="number" placeholder="المخزون" value={stock} onChange={e => setStock(e.target.value)} className="px-3 py-2 bg-[#252525] border border-[#333] rounded-xl text-white text-xs font-bold" />
                        </div>
                        <input type="text" placeholder="رابط الصورة" value={image} onChange={e => setImage(e.target.value)} className="w-full px-3 py-2 bg-[#252525] border border-[#333] rounded-xl text-white text-xs" />
                        <div className="flex gap-2 pt-2">
                            <button onClick={() => { if(name && price) onSave({ name, barcode, price: parseFloat(price), factoryPrice: parseFloat(factoryPrice) || parseFloat(price), costPrice: parseFloat(costPrice) || 0, category, stock: parseFloat(stock) || 0, image }); }} className="flex-1 bg-pink-600 text-white font-black py-2.5 rounded-xl text-xs">حفظ</button>
                            <button onClick={onClose} className="px-4 bg-[#2A2A2A] text-gray-300 font-bold py-2.5 rounded-xl text-xs">إلغاء</button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
