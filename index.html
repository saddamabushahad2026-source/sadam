    <!-- Firebase SDK Scripts -->

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const SECURITY_PIN = "1980";

        const generateBarcodeNumber = () => {
            return '629' + Math.floor(100000000 + Math.random() * 900000000).toString();
        };

        const INITIAL_CATEGORIES = [
            { id: 'oriental', name: 'حلويات شرقية', icon: 'fa-stroopwafel', color: '#EC4899', type: 'weight' },
            { id: 'pastry', name: 'معجنات وفطاير', icon: 'fa-bread-slice', color: '#F59E0B', type: 'weight' },
            { id: 'cakes', name: 'كيك المناسبات', icon: 'fa-cake-candles', color: '#A855F7', type: 'piece' },
            { id: 'icecream', name: 'آيس كريم وجيلاتو', icon: 'fa-ice-cream', color: '#06B6D4', type: 'weight' },
            { id: 'juices', name: 'مرطبات وعصائر', icon: 'fa-glass-water-droplet', color: '#10B981', type: 'piece' },
            { id: 'hot_drinks', name: 'مشروبات ساخنة', icon: 'fa-mug-hot', color: '#D97706', type: 'piece' }
        ];

        const INITIAL_PRODUCTS = [
            { id: 1, barcode: '629100000001', name: 'كنافة بالنابلسية الفاخرة', price: 15000, factoryPrice: 11000, costPrice: 9000, category: 'oriental', image: 'https://images.unsplash.com/photo-1598373182133-52452f7691ef?w=300&auto=format&fit=crop&q=80', stock: 50 },
            { id: 2, barcode: '629100000002', name: 'بقلاوة بالفستق الحلبي', price: 20000, factoryPrice: 15000, costPrice: 13000, category: 'oriental', image: 'https://images.unsplash.com/photo-1519676867240-f03562e64548?w=300&auto=format&fit=crop&q=80', stock: 40 },
            { id: 3, barcode: '629100000003', name: 'معجنات جبنة وسبانخ مشكلة', price: 10000, factoryPrice: 7500, costPrice: 5500, category: 'pastry', image: 'https://images.unsplash.com/photo-1627308595229-7830a5c91f9f?w=300&auto=format&fit=crop&q=80', stock: 60 },
            { id: 4, barcode: '629100000004', name: 'قطعة كيك شوكولاتة فاخرة', price: 3500, factoryPrice: 2500, costPrice: 1800, category: 'cakes', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300&auto=format&fit=crop&q=80', stock: 25 }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('pos');
            
            const [isPinModalOpen, setIsPinModalOpen] = useState(false);
            const [pendingTab, setPendingTab] = useState(null);
            const [enteredPin, setEnteredPin] = useState('');
            const [pinError, setPinError] = useState(false);

            const [categories, setCategories] = useState(() => {
                try {
                    const saved = localStorage.getItem('shahd_categories_v21');
                    return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
                } catch (e) {
                    return INITIAL_CATEGORIES;
                }
            });
            const [products, setProducts] = useState(() => {
                try {
                    const saved = localStorage.getItem('shahd_products_v21');
                    return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
                } catch (e) {
                    return INITIAL_PRODUCTS;
                }
            });
            const [orders, setOrders] = useState(() => {
                try {
                    const saved = localStorage.getItem('shahd_orders_v21');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [factorySales, setFactorySales] = useState(() => {
                try {
                    const saved = localStorage.getItem('shahd_factory_sales_v21');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [expenses, setExpenses] = useState(() => {
                try {
                    const saved = localStorage.getItem('shahd_expenses_v21');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            const [selectedCategory, setSelectedCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [scanInput, setScanInput] = useState('');
            const [cart, setCart] = useState([]);

            const [selectedFactoryProduct, setSelectedFactoryProduct] = useState('');
            const [factoryQuantity, setFactoryQuantity] = useState('1');
            const [factoryPriceCustom, setFactoryPriceCustom] = useState('');
            const [factorySearchName, setFactorySearchName] = useState('');
            const [factorySearchDate, setFactorySearchDate] = useState('');

            const [expenseAmount, setExpenseAmount] = useState('');
            const [expenseDetails, setExpenseDetails] = useState('');
            const [expenseDate, setExpenseDate] = useState(new Date().toISOString().split('T')[0]);

            const [filterCategory, setFilterCategory] = useState('all');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [reportProductSearch, setReportProductSearch] = useState('');

            const [currentInvoice, setCurrentInvoice] = useState(null);
            const [isProductModalOpen, setIsProductModalOpen] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);
            const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
            const [editingCategory, setEditingCategory] = useState(null);
            const [barcodeModalProduct, setBarcodeModalProduct] = useState(null);

            useEffect(() => {
                try { localStorage.setItem('shahd_categories_v21', JSON.stringify(categories)); } catch(e){}
            }, [categories]);
            useEffect(() => {
                try { localStorage.setItem('shahd_products_v21', JSON.stringify(products)); } catch(e){}
            }, [products]);
            useEffect(() => {
                try { localStorage.setItem('shahd_orders_v21', JSON.stringify(orders)); } catch(e){}
            }, [orders]);
            useEffect(() => {
                try { localStorage.setItem('shahd_factory_sales_v21', JSON.stringify(factorySales)); } catch(e){}
            }, [factorySales]);
            useEffect(() => {
                try { localStorage.setItem('shahd_expenses_v21', JSON.stringify(expenses)); } catch(e){}
            }, [expenses]);

            const handleTabChangeRequest = (tabName) => {
                if (tabName === 'pos' || tabName === 'factory' || tabName === 'expenses') {
                    setActiveTab(tabName);
                } else {
                    setPendingTab(tabName);
                    setEnteredPin('');
                    setPinError(false);
                    setIsPinModalOpen(true);
                }
            };

            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (enteredPin === SECURITY_PIN) {
                    setActiveTab(pendingTab);
                    setIsPinModalOpen(false);
                    setPendingTab(null);
                    setEnteredPin('');
                    setPinError(false);
                } else {
                    setPinError(true);
                }
            };

            const handleOpenCashDrawerManually = () => {
                alert('تم إرسال إشارة فتح الصندوق / درج النقود بنجاح.');
            };

            const filteredProducts = useMemo(() => {
                return products.filter(product => {
                    const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
                    const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          (product.barcode && product.barcode.includes(searchQuery)) ||
                                          String(product.id) === searchQuery.trim();
                    return matchesCategory && matchesSearch;
                });
            }, [products, selectedCategory, searchQuery]);

            const grandTotal = useMemo(() => cart.reduce((acc, item) => acc + item.itemTotal, 0), [cart]);

            const addOrIncrementProductDirectly = (product) => {
                if (!product) return;
                if (product.stock <= 0) {
                    alert('عذراً، هذا المنتج نفد من المخزون!');
                    return;
                }
                const cat = categories.find(c => c.id === product.category);
                const type = cat ? (cat.type || 'weight') : 'weight';

                let itemTotal = 0;
                let itemCostTotal = 0;
                let detailsLabel = '';
                let weightOrQty = 1;
                const baseCost = product.costPrice || 0;

                if (type === 'weight') {
                    weightOrQty = 1;
                    itemTotal = product.price * weightOrQty;
                    itemCostTotal = baseCost * weightOrQty;
                    detailsLabel = `الوزن: 1 كغم (1000 غرام)`;
                } else {
                    weightOrQty = 1;
                    itemTotal = product.price * 1;
                    itemCostTotal = baseCost * 1;
                    detailsLabel = `العدد: 1 قطعة`;
                }

                const cartKey = `${product.id}-${type}-${weightOrQty}`;

                setCart(prev => {
                    const existing = prev.findIndex(item => item.cartKey === cartKey);
                    if (existing > -1) {
                        const updated = [...prev];
                        const unitPrice = updated[existing].itemTotal / updated[existing].quantity;
                        const unitCost = updated[existing].itemCostTotal / updated[existing].quantity;
                        updated[existing].quantity += 1;
                        updated[existing].itemTotal = updated[existing].quantity * unitPrice;
                        updated[existing].itemCostTotal = updated[existing].quantity * unitCost;
                        return updated;
                    } else {
                        return [...prev, {
                            cartKey,
                            id: product.id,
                            name: product.name,
                            category: product.category,
                            basePrice: product.price,
                            costPrice: baseCost,
                            modalType: type,
                            weight: weightOrQty,
                            detailsLabel,
                            quantity: 1,
                            itemTotal,
                            itemCostTotal
                        }];
                    }
                });
            };

            const handleScanSubmit = (e) => {
                e.preventDefault();
                const rawInput = scanInput.trim();
                if (!rawInput) return;
                
                const foundProduct = products.find(p => p.barcode === rawInput || String(p.id) === rawInput || p.name.toLowerCase().includes(rawInput.toLowerCase()));
                
                if (foundProduct) {
                    addOrIncrementProductDirectly(foundProduct);
                    setScanInput('');
                } else {
                    alert('لم يتم العثور على أي منتج يطابق الباركود أو الاسم المدخل!');
                    setScanInput('');
                }
            };

            const handleProductCardClick = (product) => {
                addOrIncrementProductDirectly(product);
            };

            const updateCartQuantity = (cartKey, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.cartKey === cartKey) {
                        const newQty = item.quantity + delta;
                        if (newQty > 0) {
                            const unitPrice = item.itemTotal / item.quantity;
                            const unitCost = item.itemCostTotal / item.quantity;
                            return { 
                                ...item, 
                                quantity: newQty, 
                                itemTotal: newQty * unitPrice,
                                itemCostTotal: newQty * unitCost
                            };
                        }
                        return null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const removeFromCart = (cartKey) => {
                setCart(prev => prev.filter(item => item.cartKey !== cartKey));
            };

            const handleCheckoutOpenDrawer = () => {
                if (cart.length === 0) return;
                const totalCost = cart.reduce((acc, item) => acc + (item.itemCostTotal || 0), 0);
                const now = new Date();

                const newOrder = {
                    id: `ORD-${Date.now().toString().slice(-4)}`,
                    date: now.toLocaleString('ar-EG'),
                    rawDate: now.toISOString().split('T')[0],
                    items: [...cart],
                    subtotal: grandTotal,
                    tax: 0,
                    discount: 0,
                    total: grandTotal,
                    totalCost: totalCost,
                    profit: grandTotal - totalCost,
                    paymentMethod: 'cash',
                    amountPaid: grandTotal,
                    changeOrDebt: 0,
                    isDebt: false
                };

                setProducts(prev => prev.map(prod => {
                    const matchedItems = cart.filter(c => c.id === prod.id);
                    if (matchedItems.length > 0) {
                        const totalDeducted = matchedItems.reduce((acc, ci) => acc + (ci.modalType === 'weight' ? ci.weight * ci.quantity : ci.quantity), 0);
                        return { ...prod, stock: Math.max(0, prod.stock - totalDeducted) };
                    }
                    return prod;
                }));

                setOrders([newOrder, ...orders]);
                setCurrentInvoice(newOrder);
                setCart([]);
            };

            const handleAddFactorySale = (e) => {
                e.preventDefault();
                if (!selectedFactoryProduct) {
                    alert('الرجاء اختيار مادة من المخزن!');
                    return;
                }
                const prod = products.find(p => p.id === parseInt(selectedFactoryProduct));
                if (!prod) return;

                const qty = parseFloat(factoryQuantity) || 0;
                const price = factoryPriceCustom !== '' ? parseFloat(factoryPriceCustom) : (prod.factoryPrice || prod.price);

                if (qty <= 0 || price <= 0) {
                    alert('يرجى إدخال كمية وسعر صالحين!');
                    return;
                }

                if (prod.stock < qty) {
                    alert(`الكمية المتاحة بالمخزن فقط: ${prod.stock}`);
                    return;
                }

                const total = qty * price;
                const now = new Date();

                const newSale = {
                    id: `FAC-${Date.now().toString().slice(-4)}`,
                    productId: prod.id,
                    productName: prod.name,
                    quantity: qty,
                    price: price,
                    total: total,
                    date: now.toLocaleString('ar-EG'),
                    rawDate: now.toISOString().split('T')[0]
                };

                setProducts(prev => prev.map(p => p.id === prod.id ? { ...p, stock: p.stock - qty } : p));
                setFactorySales([newSale, ...factorySales]);

                setSelectedFactoryProduct('');
                setFactoryQuantity('1');
                setFactoryPriceCustom('');
            };

            const handleAddExpense = (e) => {
                e.preventDefault();
                const amt = parseFloat(expenseAmount);
                if (!amt || isNaN(amt) || amt <= 0) {
                    alert('يرجى إدخال مبلغ صحيح للصرفيات!');
                    return;
                }
                if (!expenseDetails || !expenseDetails.trim()) {
                    alert('يرجى كتابة تفاصيل الصرف!');
                    return;
                }

                const newExpense = {
                    id: `EXP-${Date.now().toString().slice(-4)}`,
                    amount: amt,
                    details: expenseDetails.trim(),
                    date: expenseDate || new Date().toISOString().split('T')[0],
                    rawDate: expenseDate || new Date().toISOString().split('T')[0]
                };

                setExpenses(prev => [newExpense, ...prev]);
                setExpenseAmount('');
                setExpenseDetails('');
            };

            const handleDeleteExpense = (id) => {
                if (confirm('هل تريد حذف هذه الصرفية؟')) {
                    setExpenses(expenses.filter(e => e.id !== id));
                }
            };

            const handleSaveCategory = (catData) => {
                if (editingCategory) {
                    setCategories(categories.map(c => c.id === editingCategory.id ? { ...catData, id: editingCategory.id } : c));
                } else {
                    setCategories([...categories, { ...catData, id: 'cat_' + Date.now() }]);
                }
                setIsCategoryModalOpen(false);
                setEditingCategory(null);
            };

            const handleDeleteCategory = (catId) => {
                if (products.some(p => p.category === catId)) {
                    alert('لا يمكن حذف قسم يحتوي على منتجات.');
                    return;
                }
                if (confirm('هل أنت متأكد من الحذف؟')) {
                    setCategories(categories.filter(c => c.id !== catId));
                }
            };

            const handleSaveProduct = (prodData) => {
                if (editingProduct) {
                    setProducts(products.map(p => p.id === editingProduct.id ? { ...prodData, id: editingProduct.id } : p));
                } else {
                    setProducts([{ ...prodData, id: Date.now() }, ...products]);
                }
                setIsProductModalOpen(false);
                setEditingProduct(null);
            };

            const handleDeleteProduct = (id) => {
                if (confirm('هل تريد حذف هذا المنتج؟')) {
                    setProducts(products.filter(p => p.id !== id));
                }
            };

            const filteredFactorySales = useMemo(() => {
                return factorySales.filter(sale => {
                    const matchesName = !factorySearchName.trim() || sale.productName.toLowerCase().includes(factorySearchName.toLowerCase());
                    const matchesDate = !factorySearchDate || sale.rawDate === factorySearchDate;
                    return matchesName && matchesDate;
                });
            }, [factorySales, factorySearchName, factorySearchDate]);

            const filteredOrders = useMemo(() => {
                return orders.filter(ord => {
                    const ordDate = ord.rawDate;
                    const matchesStartDate = !startDate || (ordDate && ordDate >= startDate);
                    const matchesEndDate = !endDate || (ordDate && ordDate <= endDate);

                    const matchesCategory = filterCategory === 'all' || ord.items.some(item => {
                        const prod = products.find(p => p.id === item.id);
                        return prod && prod.category === filterCategory;
                    });

                    const matchesProductSearch = !reportProductSearch.trim() || ord.items.some(item => 
                        item.name.toLowerCase().includes(reportProductSearch.toLowerCase())
                    );

                    return matchesStartDate && matchesEndDate && matchesCategory && matchesProductSearch;
                });
            }, [orders, startDate, endDate, filterCategory, reportProductSearch, products]);

            const filteredFactoryReports = useMemo(() => {
                return factorySales.filter(sale => {
                    const saleDate = sale.rawDate;
                    const matchesStartDate = !startDate || (saleDate && saleDate >= startDate);
                    const matchesEndDate = !endDate || (saleDate && saleDate <= endDate);
                    const matchesProductSearch = !reportProductSearch.trim() || sale.productName.toLowerCase().includes(reportProductSearch.toLowerCase());
                    return matchesStartDate && matchesEndDate && matchesProductSearch;
                });
            }, [factorySales, startDate, endDate, reportProductSearch]);

            const filteredExpensesReports = useMemo(() => {
                return expenses.filter(exp => {
                    const expDate = exp.rawDate || exp.date;
                    const matchesStartDate = !startDate || (expDate && expDate >= startDate);
                    const matchesEndDate = !endDate || (expDate && expDate <= endDate);
                    const matchesSearch = !reportProductSearch.trim() || exp.details.toLowerCase().includes(reportProductSearch.toLowerCase());
                    return matchesStartDate && matchesEndDate && matchesSearch;
                });
            }, [expenses, startDate, endDate, reportProductSearch]);

            const reportStats = useMemo(() => {
                let sales = 0;
                let cost = 0;
                filteredOrders.forEach(o => {
                    sales += o.total;
                    cost += (o.totalCost || 0);
                });

                let factoryTotal = 0;
                filteredFactoryReports.forEach(f => {
                    factoryTotal += f.total;
                });

                let totalExpenses = 0;
                filteredExpensesReports.forEach(e => {
                    totalExpenses += e.amount;
                });

                const grossProfit = sales - cost;
                const netProfit = grossProfit + factoryTotal - totalExpenses;

                return {
                    totalSales: sales,
                    totalCost: cost,
                    grossProfit: grossProfit,
                    factoryTotal: factoryTotal,
                    totalExpenses: totalExpenses,
                    netProfit: netProfit
                };
            }, [filteredOrders, filteredFactoryReports, filteredExpensesReports]);

            return (
                <div className="flex flex-col h-screen overflow-hidden bg-[#121212] text-gray-200">
                    {/* NAVBAR */}
                    <header className="bg-[#1A1A1A] text-gray-200 border-b border-[#2D2D2D] shadow-md z-20 flex-shrink-0 no-print">
                        <div className="max-w-7xl mx-auto px-3 py-3 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center space-x-3 space-x-reverse">
                                <div className="w-11 h-11 rounded-full bg-pink-600 flex items-center justify-center text-white text-xl font-bold shadow-inner">
                                    <i className="fa-solid fa-ice-cream"></i>
                                </div>
                                <div>
                                    <h1 className="text-base sm:text-lg font-black tracking-wide text-white">حلويات ومرطبات الشهد خاتون</h1>
                                    <p className="text-xs text-emerald-400 font-bold">نظام الإدارة المتكامل ومبيعات المعمل (د.ع)</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2 space-x-reverse flex-wrap">
                                <button onClick={handleOpenCashDrawerManually} className="px-3.5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs sm:text-sm font-black shadow flex items-center gap-1.5 transition-all">
                                    <i className="fa-solid fa-cash-register"></i> فتح الصندوق
                                </button>

                                <nav className="flex space-x-1.5 space-x-reverse bg-[#252525] p-1.5 rounded-xl border border-[#333] overflow-x-auto">
                                    <button onClick={() => handleTabChangeRequest('pos')} className={`px-3.5 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all whitespace-nowrap ${activeTab === 'pos' ? 'bg-pink-600 text-white shadow' : 'text-gray-300 hover:bg-[#333]'}`}>

                                            <div className="font-mono font-bold text-gray-700">{barcodeModalProduct.barcode}</div>
                                        </div>
                                    )}
                                </div>

                                <div className="flex space-x-2 space-x-reverse pt-2">
                                    <button onClick={() => window.print()} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-black py-3 rounded-xl text-xs sm:text-sm shadow">
                                        طباعة الباركود الآن
                                    </button>
                                    <button onClick={() => setBarcodeModalProduct(null)} className="px-4 bg-gray-200 text-gray-700 font-bold py-3 rounded-xl text-xs sm:text-sm">
                                        إغلاق
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CATEGORY FORM MODAL */}
                    {isCategoryModalOpen && (
                        <CategoryFormModal category={editingCategory} onClose={() => setIsCategoryModalOpen(false)} onSave={handleSaveCategory} />
                    )}

                    {/* PRODUCT FORM MODAL */}
                    {isProductModalOpen && (
                        <ProductFormModal product={editingProduct} categories={categories} onClose={() => setIsProductModalOpen(false)} onSave={handleSaveProduct} />
                    )}
                </div>
            );
        }

        function QRCodeSVG({ invoice }) {
            const qrRef = useRef(null);
            useEffect(() => {
                if (qrRef.current) {
                    qrRef.current.innerHTML = "";
                    try {
                        new QRCode(qrRef.current, {
                            text: `Order: ${invoice.id}, Total: ${invoice.total}, Date: ${invoice.date}`,
                            width: 90,
                            height: 90,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    } catch (e) {}
                }
            }, [invoice]);
            return <div ref={qrRef} className="flex justify-center items-center"></div>;
        }

        function CategoryFormModal({ category, onClose, onSave }) {
            const [name, setName] = useState(category ? category.name : '');
            const [type, setType] = useState(category ? (category.type || 'weight') : 'weight');
            const [color, setColor] = useState(category ? category.color : '#EC4899');
            const [icon, setIcon] = useState(category ? category.icon : 'fa-stroopwafel');

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 no-print">
                    <div className="bg-[#1E1E1E] rounded-3xl max-w-md w-full p-6 space-y-4 border border-[#2D2D2D] text-gray-200 shadow-2xl">
                        <div className="flex justify-between border-b border-[#2A2A2A] pb-3">
                            <h3 className="font-black text-base text-white">{category ? 'تعديل القسم' : 'إضافة قسم جديد'}</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="space-y-3.5 text-xs sm:text-sm">
                            <div>
                                <label className="block font-extrabold text-gray-300 mb-1.5">اسم القسم</label>
                                <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-3.5 py-2.5 bg-[#252525] border border-[#333] rounded-xl text-white font-bold" />
                            </div>
                            <div>
                                <label className="block font-extrabold text-gray-300 mb-1.5">نوع نظام البيع</label>
                                <select value={type} onChange={e => setType(e.target.value)} className="w-full px-3.5 py-2.5 bg-[#252525] border border-[#333] rounded-xl text-white font-bold">
                                    <option value="weight">نظام الأوزان على الميزان</option>
                                    <option value="piece">نظام القطع (الكيك والعصائر...)</option>
                                </select>
                            </div>
                            <div>
                                <label className="block font-extrabold text-gray-300 mb-1.5">لون القسم</label>
                                <input type="color" value={color} onChange={e => setColor(e.target.value)} className="w-14 h-10 bg-[#252525] border border-[#333] rounded-xl p-1 cursor-pointer" />
                            </div>
                            <div className="pt-2 flex space-x-2 space-x-reverse">
                                <button onClick={() => { if(name.trim()) onSave({ name, type, color, icon }); }} className="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-black py-3 rounded-xl shadow">حفظ القسم</button>
                                <button onClick={onClose} className="px-4 bg-[#2A2A2A] text-gray-300 font-bold py-3 rounded-xl">إلغاء</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ProductFormModal({ product, categories, onClose, onSave }) {
            const [name, setName] = useState(product ? product.name : '');
            const [barcode, setBarcode] = useState(product ? product.barcode : generateBarcodeNumber());
            const [price, setPrice] = useState(product ? product.price : '');
            const [factoryPrice, setFactoryPrice] = useState(product ? product.factoryPrice : '');
            const [costPrice, setCostPrice] = useState(product ? product.costPrice : '');
            const [category, setCategory] = useState(product ? product.category : (categories[0]?.id || ''));
            const [stock, setStock] = useState(product ? product.stock : 50);
            const [image, setImage] = useState(product ? product.image : 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=300&auto=format&fit=crop&q=80');

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 no-print overflow-y-auto">
                    <div className="bg-[#1E1E1E] rounded-3xl max-w-md w-full p-6 space-y-4 border border-[#2D2D2D] text-gray-200 shadow-2xl my-auto">
                        <div className="flex justify-between border-b border-[#2A2A2A] pb-3">
                            <h3 className="font-black text-base text-white">{product ? 'تعديل المنتج' : 'إضافة منتج جديد (توليد باركود تلقائي)'}</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="space-y-3 text-xs sm:text-sm">
                            <div>
                                <label className="block font-extrabold text-gray-300 mb-1">اسم المنتج</label>
                                <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-3.5 py-2.5 bg-[#252525] border border-[#333] rounded-xl text-white font-bold" />
                            </div>
                            <div>
                                <label className="block font-extrabold text-gray-300 mb-1">الباركود (توليد تلقائي)</label>
                                <div className="flex space-x-2 space-x-reverse">
                                    <input type="text" value={barcode} onChange={e => setBarcode(e.target.value)} className="flex-1 px-3.5 py-2.5 bg-[#252525] border border-[#333] rounded-xl font-mono text-white font-bold" />
                                    <button type="button" onClick={() => setBarcode(generateBarcodeNumber())} className="px-3.5 bg-[#2A2A2A] text-pink-400 rounded-xl font-black">توليد جديد</button>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <div>
                                    <label className="block font-extrabold text-amber-400 mb-1">التكلفة</label>
                                    <input type="number" value={costPrice} onChange={e => setCostPrice(e.target.value)} className="w-full px-3 py-2.5 bg-[#252525] border border-[#333] rounded-xl text-amber-300 font-bold" />
                                </div>
                                <div>
                                    <label className="block font-extrabold text-cyan-400 mb-1">سعر المعمل</label>
                                    <input type="number" value={factoryPrice} onChange={e => setFactoryPrice(e.target.value)} className="w-full px-3 py-2.5 bg-[#252525] border border-[#333] rounded-xl text-cyan-300 font-bold" />
                                </div>
                                <div>
                                    <label className="block font-extrabold text-pink-400 mb-1">سعر المفرد</label>
                                    <input type="number" value={price} onChange={e => setPrice(e.target.value)} className="w-full px-3 py-2.5 bg-[#252525] border border-[#333] rounded-xl text-pink-300 font-black" />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-2.5">
                                <div>
                                    <label className="block font-extrabold text-gray-300 mb-1">القسم</label>
                                    <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3.5 py-2.5 bg-[#252525] border border-[#333] rounded-xl text-white font-bold">
                                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-extrabold text-gray-300 mb-1">المخزون المتوفر</label>
                                    <input type="number" value={stock} onChange={e => setStock(e.target.value)} className="w-full px-3.5 py-2.5 bg-[#252525] border border-[#333] rounded-xl text-white font-bold" />
                                </div>
                            </div>
                            <div>
                                <label className="block font-extrabold text-gray-300 mb-1">رابط الصورة (URL)</label>
                                <input type="text" value={image} onChange={e => setImage(e.target.value)} className="w-full px-3.5 py-2.5 bg-[#252525] border border-[#333] rounded-xl text-white text-xs" />
                            </div>
                            <div className="pt-2 flex space-x-2 space-x-reverse">
                                <button onClick={() => { if(name && price) onSave({ name, barcode, price: parseFloat(price), factoryPrice: parseFloat(factoryPrice) || parseFloat(price), costPrice: parseFloat(costPrice) || 0, category, stock: parseFloat(stock) || 0, image }); }} className="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-black py-3 rounded-xl shadow">حفظ المنتج</button>
                                <button onClick={onClose} className="px-4 bg-[#2A2A2A] text-gray-300 font-bold py-3 rounded-xl">إلغاء</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
